<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Automation Inventory">
<meta name="theme-color" content="#1C1F23">
<title>Automation Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#1C1F23; --panel:#262A2F; --panel-hi:#2F343A; --line:#3A4046;
  --ink:#E9ECEF; --dim:#949CA5; --dimmer:#6B737B;
  --accent:#5FBEFA; --green:#43C06E; --red:#E5484D;
  --label:'Barlow Condensed',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  line-height:1.45;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}

#app{display:flex;flex-direction:column;height:100dvh;max-width:900px;margin:0 auto}
header{flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px}
header h1{font-family:var(--label);font-weight:700;font-size:19px;letter-spacing:.09em;
  text-transform:uppercase;margin:0;flex:1}
#status{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
#status.busy{color:var(--accent)}
#status.bad{color:var(--red)}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:24px}
.view{display:none;padding:12px 12px 0}
.view.on{display:block}

nav{flex:0 0 auto;display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:56px;display:flex;align-items:center;justify-content:center;
  font-family:var(--label);font-size:14px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);border-top:2px solid transparent;margin-top:-1px}
nav button.on{color:var(--ink);border-top-color:var(--accent)}

.search{width:100%;padding:12px 14px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;font-size:16px;margin-bottom:10px}
.search::placeholder{color:var(--dimmer)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;font-family:var(--label);font-size:13px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#06202E;font-weight:700}
.chip.oos.on{background:var(--red);border-color:var(--red);color:#fff}
.btn{display:block;width:100%;padding:14px;border-radius:8px;text-align:center;
  font-family:var(--label);font-size:16px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:700;background:var(--panel-hi);border:1px solid var(--line);margin-bottom:9px}
.btn.primary{background:var(--accent);color:#06202E;border-color:var(--accent)}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.4}
.row2{display:flex;gap:9px}

.cat-head{font-family:var(--label);font-size:13px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);margin:18px 0 7px;display:flex;justify-content:space-between;gap:8px}
.part{display:flex;align-items:center;gap:11px;background:var(--panel);
  border:1px solid var(--line);border-left-width:5px;border-radius:7px;
  padding:11px 12px;margin-bottom:7px}
.part .info{flex:1;min-width:0}
.part .nm{font-size:15px;font-weight:600;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.part .pn{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:3px}
.part .loc{display:inline-block;font-family:var(--label);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;background:var(--panel-hi);border:1px solid var(--line);
  border-radius:4px;padding:1px 6px;margin-top:4px;color:var(--dim)}
.part .right{text-align:right;flex:0 0 auto}
.part .qty{font-family:var(--mono);font-size:20px;font-weight:600;line-height:1}
.part .qty.zero{color:var(--red)}
.part .price{font-family:var(--mono);font-size:11px;color:var(--dimmer);margin-top:3px}
.part.sel{background:var(--panel-hi);border-color:var(--accent)}
.check{flex:0 0 auto;width:26px;height:26px;border:2px solid var(--line);border-radius:5px;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#06202E}
.check.on{background:var(--accent);border-color:var(--accent)}

.stepper{display:flex;align-items:center;margin-left:auto;flex:0 0 auto}
.stepper button{width:38px;height:38px;background:var(--panel-hi);border:1px solid var(--line);
  font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center}
.stepper button:first-child{border-radius:7px 0 0 7px}
.stepper button:last-child{border-radius:0 7px 7px 0}
.stepper input{width:52px;height:38px;text-align:center;background:var(--bg);
  border:1px solid var(--line);border-left:none;border-right:none;
  font-family:var(--mono);font-size:16px;font-weight:600}

label.f{display:block;margin:13px 0 5px;font-family:var(--label);font-size:13px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
input.f,select.f,textarea.f{width:100%;padding:12px;background:var(--panel);
  border:1px solid var(--line);border-radius:7px}
textarea.f{min-height:70px;resize:vertical;font-family:var(--body)}
.mono{font-family:var(--mono)}

.empty{text-align:center;color:var(--dim);padding:48px 24px;font-size:14px}
.empty strong{display:block;font-family:var(--label);font-size:17px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink);margin-bottom:7px}
.bar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  margin:14px -12px 0;padding:11px 12px;display:flex;align-items:center;gap:11px}
.bar .sum{flex:1;font-family:var(--mono);font-size:13px}
.bar .sum b{font-size:16px}
.bar .btn{width:auto;padding:12px 20px;margin:0}
.note{font-size:12.5px;color:var(--dim);margin:8px 0}
.err{background:rgba(229,72,77,.12);border:1px solid var(--red);color:#FFB3B5;
  padding:11px;border-radius:7px;font-size:13.5px;margin:10px 0}
.ok{background:rgba(67,192,110,.12);border:1px solid var(--green);color:#A8E6C0;
  padding:11px;border-radius:7px;font-size:13.5px;margin:10px 0}
video{width:100%;border-radius:8px;background:#000;margin-bottom:10px}

.sheet{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;
  flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 14px
  calc(env(safe-area-inset-bottom) + 14px);overflow-y:auto}
.sheet.on{display:flex}
.sheet .inner{max-width:900px;margin:0 auto;width:100%}
.sheet h2{font-family:var(--label);font-size:21px;letter-spacing:.09em;
  text-transform:uppercase;margin:0 0 4px}
.mini{display:grid;grid-template-columns:1fr 60px 74px;gap:7px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line)}
.mini input{padding:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;font-family:var(--mono);font-size:14px;width:100%}
.mini .rname{font-size:14px;font-weight:600}
.mini .rpn{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.hd{font-family:var(--label);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dimmer);border:none}

#picklist{display:none}
@media print{
  body{background:#fff;color:#000}
  #app,.sheet{display:none !important}
  #picklist{display:block !important;font-family:var(--body)}
  #picklist h1{font-family:var(--label);letter-spacing:.09em;text-transform:uppercase}
  #picklist table{width:100%;border-collapse:collapse;margin-top:14px}
  #picklist th,#picklist td{border:1px solid #000;padding:6px 8px;text-align:left;font-size:12px}
  #picklist th{background:#eee;font-family:var(--label);text-transform:uppercase}
  #picklist .m{font-family:var(--mono)}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Automation Inventory</h1>
    <span id="status">—</span>
  </header>

  <main>
    <section class="view on" id="v-inv">
      <input class="search" id="inv-q" placeholder="Search name, part number or description">
      <div class="chips" id="inv-chips"></div>
      <div class="row2">
        <button class="btn" id="loc-toggle" onclick="toggleLocMode()">Assign locations</button>
      </div>
      <div id="inv-list"></div>
    </section>

    <section class="view" id="v-recv">
      <button class="btn primary" onclick="startScan('recv')">Scan barcode</button>
      <div class="row2">
        <button class="btn" onclick="document.getElementById('pdf-in').click()">Upload order PDF</button>
        <button class="btn" onclick="manualAdd()">Add by hand</button>
      </div>
      <input type="file" id="pdf-in" accept="application/pdf" hidden onchange="onPdf(event)">
      <p class="note">Scanning or uploading builds a list below. Nothing changes your stock until you commit it.</p>
      <div id="recv-list"></div>
    </section>

    <section class="view" id="v-pull">
      <button class="btn" onclick="startScan('pull')">Scan barcode</button>
      <input class="search" id="pull-q" placeholder="Search name, part number or description">
      <div class="chips" id="pull-chips"></div>
      <div id="pull-list"></div>
    </section>

    <section class="view" id="v-proj">
      <button class="btn primary" onclick="newProject()">New project</button>
      <div id="proj-list"></div>
    </section>
  </main>

  <nav>
    <button class="on" data-tab="inv" onclick="tab('inv')">Inventory</button>
    <button data-tab="recv" onclick="tab('recv')">Receive</button>
    <button data-tab="pull" onclick="tab('pull')">Pull</button>
    <button data-tab="proj" onclick="tab('proj')">Projects</button>
  </nav>
</div>

<div class="sheet" id="s-scan"><div class="inner">
  <h2>Scan</h2>
  <p class="note" id="scan-hint"></p>
  <video id="scan-video" playsinline muted></video>
  <div id="scan-log"></div>
  <button class="btn" onclick="stopScan()">Done</button>
</div></div>

<div class="sheet" id="s-review"><div class="inner">
  <h2>Check this order</h2>
  <p class="note" id="review-src"></p>
  <div class="mini hd"><span>Item</span><span>Qty</span><span>Price</span></div>
  <div id="review-rows"></div>
  <button class="btn primary" onclick="acceptReview()">Add these to the receiving list</button>
  <button class="btn" onclick="closeSheet('s-review')">Cancel</button>
</div></div>

<div class="sheet" id="s-part"><div class="inner">
  <h2 id="pe-title">Edit item</h2>
  <label class="f" for="pe-name">Item name</label>
  <input class="f" id="pe-name" placeholder="What you'd call it out loud">
  <label class="f" for="pe-pn">Part number</label>
  <input class="f mono" id="pe-pn" autocapitalize="characters">
  <label class="f" for="pe-desc">Description</label>
  <textarea class="f" id="pe-desc"></textarea>
  <label class="f" for="pe-cat">Category</label>
  <input class="f" id="pe-cat" list="cat-options">
  <datalist id="cat-options"></datalist>
  <label class="f" for="pe-loc">Location</label>
  <input class="f" id="pe-loc" list="loc-options" placeholder="e.g. White shelves">
  <datalist id="loc-options"></datalist>
  <div class="row2">
    <div style="flex:1"><label class="f" for="pe-qty">On hand</label>
      <input class="f mono" id="pe-qty" type="number" inputmode="numeric"></div>
    <div style="flex:1"><label class="f" for="pe-price">Unit price</label>
      <input class="f mono" id="pe-price" type="number" inputmode="decimal" step="0.01"></div>
  </div>
  <div id="pe-msg"></div>
  <button class="btn primary" onclick="savePart()">Save</button>
  <button class="btn" onclick="closeSheet('s-part')">Back</button>
  <button class="btn danger" onclick="deletePart()">Delete this item</button>
</div></div>

<div class="sheet" id="s-checkout"><div class="inner">
  <h2>Pull parts</h2>
  <div id="checkout-lines"></div>
  <label class="f" for="co-job">Job name</label>
  <input class="f" id="co-job" placeholder="e.g. Moreman Gin — dryer panel">
  <label class="f" for="co-cust">Customer</label>
  <input class="f" id="co-cust">
  <label class="f" for="co-who">Pulled by</label>
  <input class="f" id="co-who">
  <label class="f" for="co-proj">Project (optional)</label>
  <select class="f" id="co-proj"></select>
  <label class="f" for="co-note">Notes</label>
  <textarea class="f" id="co-note"></textarea>
  <div id="co-msg"></div>
  <button class="btn primary" onclick="submitPull()">Confirm and deduct stock</button>
  <button class="btn" onclick="closeSheet('s-checkout')">Back</button>
</div></div>

<div class="sheet" id="s-project"><div class="inner">
  <h2 id="proj-title">New project</h2>
  <label class="f" for="pj-name">Project name</label>
  <input class="f" id="pj-name">
  <label class="f" for="pj-status">Status</label>
  <select class="f" id="pj-status"><option>Open</option><option>On hold</option><option>Complete</option></select>
  <label class="f" for="pj-notes">Notes</label>
  <textarea class="f" id="pj-notes"></textarea>
  <div id="pj-items"></div>
  <div id="pj-msg"></div>
  <button class="btn primary" onclick="saveProject()">Save project</button>
  <button class="btn" onclick="closeSheet('s-project')">Back</button>
  <button class="btn danger" id="pj-delete" onclick="deleteProject()">Delete this project</button>
</div></div>

<div id="picklist"></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
/* ==================================================================
   CONFIG — fill in API_URL only. The passphrase is never stored here;
   each device is asked once on first launch.
   ================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbydosGoTKG0IyHgyCLipUDOTKV8gH27TZTOGeUglCIo9MlVhkDtPhkngWpR_kyZ8GRx/exec';
let SECRET = localStorage.getItem('secret') || '';
/* ================================================================== */

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
}

let DATA = { parts: [], projects: [], projectItems: [], categories: [], transactions: [] };
let recvQueue = [], pullSel = {}, reviewRows = [];
let editingProject = null, editingPart = null;
let scanTarget = null, codeReader = null;
let invCat = 'All', pullCat = 'All';
let locMode = false, locSel = {};

const $ = id => document.getElementById(id);
const money = n => '$' + (Number(n) || 0).toFixed(2);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const DEFAULT_COLOR = '#6B737B';

function askSecret(message) {
  const s = prompt(message || 'Passphrase for this inventory\n(ask whoever set it up)');
  if (s && s.trim()) { SECRET = s.trim(); localStorage.setItem('secret', SECRET); return true; }
  return false;
}
function forgetSecret() { localStorage.removeItem('secret'); SECRET = ''; }

/* ---------- category colours come from the sheet, not a hash ---------- */
function catColor(category) {
  const hit = (DATA.categories || []).find(c =>
    String(c.category).toUpperCase() === String(category).toUpperCase() && c.color);
  return hit ? String(hit.color) : DEFAULT_COLOR;
}
const partName = p => String(p.name || '').trim() || String(p.partNumber);

/* ---------- server ---------- */
function setStatus(t, cls) { const el = $('status'); el.textContent = t; el.className = cls || ''; }

async function apiGet() {
  if (!SECRET && !askSecret()) { setStatus('locked', 'bad'); return; }
  setStatus('syncing…', 'busy');
  try {
    const r = await fetch(`${API_URL}?secret=${encodeURIComponent(SECRET)}`);
    const j = await r.json();
    if (!j.ok) {
      if (/secret/i.test(j.error || '')) {
        forgetSecret(); setStatus('wrong passphrase', 'bad');
        if (askSecret('That passphrase was wrong. Try again.')) return apiGet();
        return;
      }
      throw new Error(j.error);
    }
    DATA = j;
    setStatus('synced ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}));
    renderAll();
  } catch (e) { setStatus('offline', 'bad'); console.error(e); }
}

async function apiPost(body) {
  setStatus('saving…', 'busy');
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ secret: SECRET }, body))
    });
    const j = await r.json();
    setStatus(j.ok ? 'saved' : 'error', j.ok ? '' : 'bad');
    return j;
  } catch (e) {
    setStatus('offline', 'bad');
    return { ok: false, error: 'No connection. Nothing was saved — try again on signal.' };
  }
}

/* ---------- navigation ---------- */
function tab(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('v-' + name).classList.add('on');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelector('main').scrollTop = 0;
}
const openSheet = id => $(id).classList.add('on');
const closeSheet = id => $(id).classList.remove('on');

/* ---------- filtering ---------- */
function matches(p, q) {
  if (!q) return true;
  const u = q.toUpperCase();
  return String(p.partNumber).toUpperCase().includes(u) ||
         String(p.name || '').toUpperCase().includes(u) ||
         String(p.description || '').toUpperCase().includes(u) ||
         String(p.binLocation || '').toUpperCase().includes(u);
}

/**
 * Zero-quantity parts drop out of the normal list — they're not inventory,
 * they're history. They come back when you search for them, or via the
 * Out of stock chip.
 */
function filterParts(query, cat, opts) {
  const q = (query || '').trim();
  const searching = q.length > 0;
  return DATA.parts.filter(p => {
    const qty = Number(p.qty) || 0;
    if (cat === 'Out of stock') { if (qty > 0) return false; }
    else {
      if (cat && cat !== 'All' && (p.category || 'Uncategorized') !== cat) return false;
      if (qty <= 0 && !searching && !(opts && opts.includeZero)) return false;
    }
    return matches(p, q);
  });
}

function groupByCategory(parts) {
  const g = {};
  parts.forEach(p => { const c = p.category || 'Uncategorized'; (g[c] = g[c] || []).push(p); });
  return Object.keys(g).sort().map(c => ({
    cat: c,
    items: g[c].sort((a, b) => partName(a).localeCompare(partName(b)))
  }));
}

function renderChips(hostId, active, onPick) {
  const cats = [...new Set(DATA.parts.map(p => p.category || 'Uncategorized'))].sort();
  const zeros = DATA.parts.filter(p => (Number(p.qty) || 0) <= 0).length;
  const host = $(hostId);
  host.innerHTML = '';
  const add = (label, cls) => {
    const b = document.createElement('button');
    b.className = 'chip ' + (cls || '') + (label === active ? ' on' : '');
    b.textContent = label + (label === 'Out of stock' && zeros ? ` (${zeros})` : '');
    b.onclick = () => onPick(label);
    host.appendChild(b);
  };
  add('All');
  if (zeros) add('Out of stock', 'oos');
  cats.forEach(c => add(c));
}

/* ---------- inventory ---------- */
function renderAll() { renderInventory(); renderPull(); renderProjects(); renderRecv(); fillDatalists(); }

function fillDatalists() {
  const cats = [...new Set([
    ...DATA.parts.map(p => p.category || 'Uncategorized'),
    ...(DATA.categories || []).map(c => c.category)
  ].filter(Boolean))].sort();
  $('cat-options').innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');
  const locs = [...new Set(DATA.parts.map(p => p.binLocation).filter(Boolean))].sort();
  $('loc-options').innerHTML = locs.map(l => `<option value="${esc(l)}">`).join('');
}

function toggleLocMode() {
  locMode = !locMode;
  locSel = {};
  $('loc-toggle').textContent = locMode ? 'Cancel location assignment' : 'Assign locations';
  renderInventory();
}

function renderInventory() {
  renderChips('inv-chips', invCat, c => { invCat = c; renderInventory(); });
  const parts = filterParts($('inv-q').value, invCat, { includeZero: locMode });
  const host = $('inv-list');

  if (!parts.length) {
    host.innerHTML = DATA.parts.length
      ? `<div class="empty"><strong>Nothing matches</strong>
          Out-of-stock items are hidden unless you search for them or tap Out of stock.</div>`
      : `<div class="empty"><strong>Nothing here yet</strong>
          Receive an order or scan a box to start building your stock list.</div>`;
    return;
  }

  const totalValue = parts.reduce((s, p) => s + (Number(p.qty) || 0) * (Number(p.unitPrice) || 0), 0);

  host.innerHTML = groupByCategory(parts).map(g => `
    <div class="cat-head"><span>${esc(g.cat)}</span><span>${g.items.length}</span></div>
    ${g.items.map(p => {
      const pn = String(p.partNumber);
      const qty = Number(p.qty) || 0;
      const on = locSel[pn];
      return `
      <div class="part ${on ? 'sel' : ''}" style="border-left-color:${esc(catColor(g.cat))}"
           onclick="${locMode ? `toggleLocSel('${esc(pn)}')` : `openPart('${esc(pn)}')`}">
        ${locMode ? `<div class="check ${on ? 'on' : ''}">${on ? '✓' : ''}</div>` : ''}
        <div class="info">
          <div class="nm">${esc(partName(p))}</div>
          <div class="pn">${esc(pn)}</div>
          ${p.binLocation ? `<span class="loc">${esc(p.binLocation)}</span>` : ''}
        </div>
        <div class="right">
          <div class="qty ${qty <= 0 ? 'zero' : ''}">${qty}</div>
          <div class="price">${money(p.unitPrice)} ea</div>
        </div>
      </div>`;
    }).join('')}
  `).join('');

  if (locMode) {
    const n = Object.keys(locSel).length;
    host.innerHTML += `<div class="bar">
      <div class="sum">${n} selected</div>
      <button class="btn primary" onclick="applyLocation()" ${n ? '' : 'disabled'}>Set location</button>
    </div>`;
  } else {
    host.innerHTML += `<div class="cat-head" style="margin-top:22px">
      <span>Total value on hand</span><span>${money(totalValue)}</span></div>`;
  }
}

function toggleLocSel(pn) {
  if (locSel[pn]) delete locSel[pn]; else locSel[pn] = true;
  renderInventory();
}

async function applyLocation() {
  const known = [...new Set(DATA.parts.map(p => p.binLocation).filter(Boolean))];
  const hint = known.length ? `\n\nAlready in use: ${known.join(', ')}` : '';
  const loc = prompt('Location for the selected items' + hint);
  if (loc === null) return;
  const r = await apiPost({ action: 'bulkLocation', location: loc.trim(),
                            partNumbers: Object.keys(locSel) });
  if (!r.ok) { alert(r.error); return; }
  locMode = false; locSel = {};
  $('loc-toggle').textContent = 'Assign locations';
  await apiGet();
}

/* ---------- part editor ---------- */
function openPart(pn) {
  const p = DATA.parts.find(x => String(x.partNumber) === pn);
  if (!p) return;
  editingPart = pn;
  $('pe-title').textContent = partName(p);
  $('pe-name').value  = p.name || '';
  $('pe-pn').value    = pn;
  $('pe-desc').value  = p.description || '';
  $('pe-cat').value   = p.category || '';
  $('pe-loc').value   = p.binLocation || '';
  $('pe-qty').value   = Number(p.qty) || 0;
  $('pe-price').value = Number(p.unitPrice) || 0;
  $('pe-msg').innerHTML = '';
  openSheet('s-part');
}

async function savePart() {
  const newPn = $('pe-pn').value.trim().toUpperCase();
  if (!newPn) { $('pe-msg').innerHTML = '<div class="err">Part number can\'t be empty.</div>'; return; }
  const r = await apiPost({
    action: 'editPart',
    partNumber: editingPart,
    newPartNumber: newPn !== editingPart ? newPn : undefined,
    name: $('pe-name').value.trim(),
    description: $('pe-desc').value.trim(),
    category: $('pe-cat').value.trim() || 'Uncategorized',
    location: $('pe-loc').value.trim(),
    qty: $('pe-qty').value,
    unitPrice: $('pe-price').value
  });
  if (!r.ok) { $('pe-msg').innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  closeSheet('s-part');
  editingPart = null;
  await apiGet();
}

async function deletePart() {
  const p = DATA.parts.find(x => String(x.partNumber) === editingPart);
  const qty = Number(p && p.qty) || 0;
  let msg = `Delete ${partName(p || {})} from the parts list?`;
  if (qty > 0) msg += `\n\nThere are still ${qty} on hand. Deleting removes the item, not the parts.`;
  msg += '\n\nPast transactions are kept either way.';
  if (!confirm(msg)) return;
  const r = await apiPost({ action: 'deletePart', partNumber: editingPart });
  if (!r.ok) { $('pe-msg').innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  closeSheet('s-part');
  editingPart = null;
  await apiGet();
}

/* ---------- pull ---------- */
function renderPull() {
  renderChips('pull-chips', pullCat, c => { pullCat = c; renderPull(); });
  const parts = filterParts($('pull-q').value, pullCat);
  const host = $('pull-list');

  if (!parts.length) {
    host.innerHTML = `<div class="empty"><strong>No matches</strong>
      Items with none on hand are hidden unless you search for them.</div>`;
    return;
  }

  host.innerHTML = groupByCategory(parts).map(g => `
    <div class="cat-head"><span>${esc(g.cat)}</span></div>
    ${g.items.map(p => {
      const pn = String(p.partNumber);
      const on = pullSel[pn] != null;
      const have = Number(p.qty) || 0;
      return `
      <div class="part ${on ? 'sel' : ''}" style="border-left-color:${esc(catColor(g.cat))}">
        <div class="check ${on ? 'on' : ''}" onclick="togglePull('${esc(pn)}')">${on ? '✓' : ''}</div>
        <div class="info" onclick="togglePull('${esc(pn)}')">
          <div class="nm">${esc(partName(p))}</div>
          <div class="pn">${esc(pn)} · ${have} on hand · ${money(p.unitPrice)} ea</div>
          ${p.binLocation ? `<span class="loc">${esc(p.binLocation)}</span>` : ''}
        </div>
        ${on ? `<div class="stepper">
          <button onclick="bumpPull('${esc(pn)}',-1)">−</button>
          <input type="number" inputmode="numeric" value="${pullSel[pn]}" min="1" max="${have}"
                 onchange="setPull('${esc(pn)}',this.value)">
          <button onclick="bumpPull('${esc(pn)}',1)">+</button>
        </div>` : `<div class="right"><div class="qty ${have <= 0 ? 'zero' : ''}">${have}</div></div>`}
      </div>`;
    }).join('')}
  `).join('');

  const keys = Object.keys(pullSel);
  if (keys.length) {
    const total = keys.reduce((s, pn) => {
      const p = DATA.parts.find(x => String(x.partNumber) === pn);
      return s + (pullSel[pn] * (Number(p && p.unitPrice) || 0));
    }, 0);
    host.innerHTML += `<div class="bar">
      <div class="sum">${keys.length} item${keys.length > 1 ? 's' : ''}<br><b>${money(total)}</b></div>
      <button class="btn primary" onclick="openCheckout()">Review</button></div>`;
  }
}

function togglePull(pn) {
  if (pullSel[pn] != null) delete pullSel[pn];
  else {
    const p = DATA.parts.find(x => String(x.partNumber) === pn);
    if ((Number(p && p.qty) || 0) <= 0) { alert(pn + ' has none on hand.'); return; }
    pullSel[pn] = 1;
  }
  renderPull();
}
function bumpPull(pn, d) { setPull(pn, (pullSel[pn] || 0) + d); }
function setPull(pn, v) {
  const p = DATA.parts.find(x => String(x.partNumber) === pn);
  const have = Number(p && p.qty) || 0;
  pullSel[pn] = Math.max(1, Math.min(have, Math.round(Number(v) || 1)));
  renderPull();
}

/* ---------- receive queue ---------- */
function renderRecv() {
  const host = $('recv-list');
  if (!recvQueue.length) { host.innerHTML = ''; return; }
  const total = recvQueue.reduce((s, l) => s + l.qty * l.unitPrice, 0);
  host.innerHTML = `<div class="cat-head"><span>Ready to receive</span><span>${recvQueue.length}</span></div>` +
    recvQueue.map((l, i) => `
      <div class="part" style="border-left-color:var(--green)">
        <div class="info">
          <div class="nm">${esc(l.name || l.partNumber)}</div>
          <div class="pn">${esc(l.partNumber)}</div>
        </div>
        <div class="stepper">
          <button onclick="bumpRecv(${i},-1)">−</button>
          <input type="number" inputmode="numeric" value="${l.qty}" min="1"
                 onchange="recvQueue[${i}].qty=Math.max(1,Math.round(+this.value||1));renderRecv()">
          <button onclick="bumpRecv(${i},1)">+</button>
        </div>
      </div>`).join('') +
    `<div class="bar">
      <div class="sum">${recvQueue.length} line${recvQueue.length > 1 ? 's' : ''}<br><b>${money(total)}</b></div>
      <button class="btn primary" onclick="commitRecv()">Add to stock</button></div>
     <button class="btn danger" onclick="recvQueue=[];renderRecv()">Clear list</button>`;
}
function bumpRecv(i, d) { recvQueue[i].qty = Math.max(1, recvQueue[i].qty + d); renderRecv(); }

function queueReceive(partNumber, description, qty, unitPrice, name, orderNumber) {
  const pn = String(partNumber).trim().toUpperCase();
  const found = recvQueue.find(l => l.partNumber === pn);
  if (found) { found.qty += (qty || 1); renderRecv(); return; }
  const known = DATA.parts.find(p => String(p.partNumber).toUpperCase() === pn);
  recvQueue.push({
    partNumber: pn,
    name: name || (known ? known.name : '') || deriveName(description) || pn,
    description: description || (known ? known.description : ''),
    qty: qty || 1,
    unitPrice: unitPrice != null ? unitPrice : (known ? Number(known.unitPrice) || 0 : 0),
    orderNumber: orderNumber || ''
  });
  renderRecv();
}

/** A readable short name out of a long catalog description. */
function deriveName(desc) {
  if (!desc) return '';
  let s = String(desc).split(/[,.;]/)[0].trim();
  if (s.length > 52) s = s.slice(0, 52).replace(/\s+\S*$/, '') + '…';
  return s;
}

async function commitRecv() {
  const who = askWho();
  if (!who) return;
  const r = await apiPost({ action: 'receive', lines: recvQueue, who,
                            orderNumber: (recvQueue[0] || {}).orderNumber || '' });
  if (!r.ok) { alert(r.error); return; }
  recvQueue = [];
  renderRecv();
  await apiGet();
  tab('inv');
}

function manualAdd() {
  const pn = prompt('Part number');
  if (!pn) return;
  const known = DATA.parts.find(p => String(p.partNumber).toUpperCase() === pn.trim().toUpperCase());
  const nm = known ? known.name : (prompt('Item name (what you\'d call it)') || '');
  const qty = Math.max(1, Math.round(Number(prompt('Quantity', '1')) || 1));
  const desc = known ? known.description : (prompt('Description (optional)') || '');
  const price = known ? Number(known.unitPrice) || 0 : Number(prompt('Unit price', '0')) || 0;
  queueReceive(pn, desc, qty, price, nm);
}

function askWho() {
  let who = localStorage.getItem('who') || '';
  if (!who) {
    who = prompt('Your name (so the log knows who did this)') || '';
    if (who) localStorage.setItem('who', who);
  }
  return who;
}

/* ---------- scanning ---------- */
// AD labels read like  P1AM-SERIAL+0323FB  — part number, then a lot code.
const cleanBarcode = raw => String(raw).trim().toUpperCase().split('+')[0].trim();

async function startScan(target) {
  scanTarget = target;
  $('scan-hint').textContent = target === 'recv'
    ? 'Each scan adds one to the receiving list.'
    : 'Each scan adds one to the pull list.';
  $('scan-log').innerHTML = '';
  openSheet('s-scan');
  try {
    codeReader = new ZXing.BrowserMultiFormatReader();
    await codeReader.decodeFromConstraints(
      { video: { facingMode: { ideal: 'environment' } } }, 'scan-video',
      result => { if (result) onScan(result.getText()); });
  } catch (e) {
    $('scan-log').innerHTML = `<div class="err">Camera didn't start. ${esc(e.message || e)}
      <br><br>Needs https and camera permission. Desktop browsers without a webcam
      can't scan — use the other Receive options there.</div>`;
  }
}
function stopScan() {
  if (codeReader) { try { codeReader.reset(); } catch (e) {} codeReader = null; }
  closeSheet('s-scan');
  renderAll();
}

let lastScan = { code: '', at: 0 };
function onScan(raw) {
  const pn = cleanBarcode(raw), now = Date.now();
  if (pn === lastScan.code && now - lastScan.at < 2500) return;
  lastScan = { code: pn, at: now };
  if (navigator.vibrate) navigator.vibrate(45);
  const known = DATA.parts.find(p => String(p.partNumber).toUpperCase() === pn);

  if (scanTarget === 'recv') {
    queueReceive(pn, known ? known.description : '', 1,
                 known ? Number(known.unitPrice) || 0 : 0, known ? known.name : '');
    log(`<div class="ok"><b>${esc(known ? partName(known) : pn)}</b> — added${known ? '' : ' (new part)'}</div>`);
  } else {
    if (!known) { log(`<div class="err"><b>${esc(pn)}</b> isn't in inventory yet.</div>`); return; }
    const have = Number(known.qty) || 0, want = (pullSel[pn] || 0) + 1;
    if (want > have) { log(`<div class="err"><b>${esc(partName(known))}</b> — only ${have} on hand.</div>`); return; }
    pullSel[pn] = want;
    log(`<div class="ok"><b>${esc(partName(known))}</b> — pulling ${want}</div>`);
  }
}
const log = html => $('scan-log').insertAdjacentHTML('afterbegin', html);

/* ==================================================================
   PDF parsing — column aware.
   The old version rebuilt visual lines and guessed which ones were part
   numbers. That merged every line item into one on real multi-item orders.
   This version finds the table's column headers, learns their x positions,
   and assigns every scrap of text to a column. A new line item starts
   whenever the Item Code column has something in it.
   ================================================================== */
const MONEY_TAIL = /\$\s*([\d,]+\.\d{2})\s+(\d+)\s+\$\s*([\d,]+\.\d{2})\s*$/;
const num = s => Number(String(s).replace(/[$,\s]/g, '')) || 0;

async function parsePdf(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const items = [];
  let orderNumber = '';
  let current = null;

  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    const its = tc.items
      .map(it => ({ x: it.transform[4], y: it.transform[5], s: String(it.str).trim() }))
      .filter(o => o.s);

    if (!orderNumber) {
      const joined = its.map(o => o.s).join(' ');
      const m = joined.match(/ORDER\s*#\s*:?\s*(\d{4,})/i);
      if (m) orderNumber = m[1];
    }

    const find = re => its.find(o => re.test(o.s));
    const hCode  = find(/^item\s*code$/i)  || find(/item\s*code/i);
    const hDesc  = find(/^description$/i);
    const hPrice = find(/^price$/i);
    const hQty   = find(/^quantity$/i)     || find(/^qty$/i);
    const hTotal = find(/^total/i);
    if (!hCode || !hDesc) continue;      // no table on this page

    const stop = its.find(o => /^sub\s*total$/i.test(o.s) || /^subtotal$/i.test(o.s));
    const topY = hCode.y - 4;
    const botY = stop ? stop.y + 4 : -Infinity;

    // Column boundaries from the header positions, with a little slack so
    // right-aligned numbers don't fall into the previous column.
    const bDesc  = hDesc.x - 6;
    const bPrice = hPrice ? hPrice.x - 24 : Infinity;
    const bQty   = hQty   ? hQty.x   - 24 : Infinity;
    const bTotal = hTotal ? hTotal.x - 24 : Infinity;

    const body = its.filter(o => o.y < topY && o.y > botY);
    const rows = [];
    body.forEach(o => {
      let row = rows.find(r => Math.abs(r.y - o.y) <= 3);
      if (!row) { row = { y: o.y, cells: [] }; rows.push(row); }
      row.cells.push(o);
    });
    rows.sort((a, b) => b.y - a.y);

    // Split each row into its columns.
    const parsed = rows.map(row => {
      const bucket = { code: [], desc: [], price: [], qty: [], total: [] };
      row.cells.sort((a, b) => a.x - b.x).forEach(o => {
        if (o.x < bDesc)       bucket.code.push(o.s);
        else if (o.x < bPrice) bucket.desc.push(o.s);
        else if (o.x < bQty)   bucket.price.push(o.s);
        else if (o.x < bTotal) bucket.qty.push(o.s);
        else                   bucket.total.push(o.s);
      });
      let desc  = bucket.desc.join(' ').replace(/\s+/g, ' ').trim();
      let price = bucket.price.join('').trim();
      let qty   = bucket.qty.join('').trim();
      const tail = desc.match(MONEY_TAIL);   // some layouts run the numbers onto the description
      if (tail) { price = price || tail[1]; qty = qty || tail[2]; desc = desc.replace(MONEY_TAIL, '').trim(); }
      return { y: row.y, code: bucket.code.join(' ').trim(), desc, price, qty };
    });

    /* The item code is printed under the product thumbnail, so a line item's
       description can sit ABOVE its own part number. Streaming top-to-bottom
       therefore hands those lines to the previous item and collapses a
       multi-item order into one row. Instead: treat every row bearing a code
       as an anchor, then give each remaining row to whichever anchor's band
       it falls inside. */
    const anchors = parsed.filter(r => r.code);
    if (!anchors.length) continue;

    const bands = anchors.map((a, i) => ({
      row: a,
      hi: i === 0 ? Infinity : (anchors[i - 1].y + a.y) / 2,
      lo: i === anchors.length - 1 ? -Infinity : (a.y + anchors[i + 1].y) / 2
    }));

    bands.forEach(b => {
      const mine = parsed.filter(r => r.y <= b.hi && r.y > b.lo);
      const item = { partNumber: b.row.code.toUpperCase(), name: '', description: '',
                     qty: 0, unitPrice: 0, orderNumber };
      mine.forEach(r => {
        if (r.desc)  item.description = (item.description + ' ' + r.desc).trim();
        if (r.price) item.unitPrice = num(r.price);
        if (r.qty)   item.qty = num(r.qty);
      });
      items.push(item);
    });
  }
  if (current) items.push(current);

  items.forEach(i => {
    i.name = deriveName(i.description) || i.partNumber;
    if (!i.qty || i.qty < 1) i.qty = 1;
  });
  return { items, orderNumber };
}

async function onPdf(ev) {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  setStatus('reading pdf…', 'busy');
  try {
    const parsed = await parsePdf(file);
    if (!parsed.items.length) {
      alert('No line-item table found in that PDF. Use "Add by hand", and send the file to Claude so the parser can learn this layout.');
      setStatus('synced');
      return;
    }
    reviewRows = parsed.items;
    $('review-src').textContent =
      `${parsed.orderNumber ? 'Order #' + parsed.orderNumber + ' · ' : ''}` +
      `${parsed.items.length} line${parsed.items.length > 1 ? 's' : ''} found. ` +
      `Check the names, quantities and prices before adding.`;
    renderReview();
    openSheet('s-review');
    setStatus('synced');
  } catch (e) {
    console.error(e);
    alert('That PDF could not be read. ' + (e.message || ''));
    setStatus('synced');
  }
}

function renderReview() {
  $('review-rows').innerHTML = reviewRows.map((r, i) => `
    <div class="mini">
      <div>
        <input value="${esc(r.name)}" style="font-family:var(--body);margin-bottom:4px"
               onchange="reviewRows[${i}].name=this.value">
        <div class="rpn">${esc(r.partNumber)}</div>
      </div>
      <input type="number" inputmode="numeric" value="${r.qty}"
             onchange="reviewRows[${i}].qty=Math.max(0,Math.round(+this.value||0))">
      <input type="number" inputmode="decimal" step="0.01" value="${r.unitPrice}"
             onchange="reviewRows[${i}].unitPrice=+this.value||0">
    </div>`).join('');
}

function acceptReview() {
  reviewRows.filter(r => r.qty > 0).forEach(r =>
    queueReceive(r.partNumber, r.description, r.qty, r.unitPrice, r.name, r.orderNumber));
  closeSheet('s-review');
  reviewRows = [];
}

/* ---------- checkout ---------- */
function openCheckout() {
  const lines = Object.keys(pullSel).map(pn => {
    const p = DATA.parts.find(x => String(x.partNumber) === pn) || {};
    return { partNumber: pn, name: partName(p), qty: pullSel[pn], unitPrice: Number(p.unitPrice) || 0 };
  });
  const total = lines.reduce((s, l) => s + l.qty * l.unitPrice, 0);

  $('checkout-lines').innerHTML =
    `<div class="mini hd"><span>Item</span><span>Qty</span><span>Value</span></div>` +
    lines.map(l => `<div class="mini">
      <div><div class="rname">${esc(l.name)}</div><div class="rpn">${esc(l.partNumber)}</div></div>
      <div class="mono" style="text-align:center">${l.qty}</div>
      <div class="mono" style="text-align:right">${money(l.qty * l.unitPrice)}</div>
    </div>`).join('') +
    `<div class="mini"><div class="hd">Total</div><div></div>
      <div class="mono" style="text-align:right">${money(total)}</div></div>`;

  $('co-who').value = localStorage.getItem('who') || '';
  $('co-proj').innerHTML = '<option value="">— none —</option>' +
    DATA.projects.filter(p => p.status !== 'Complete')
      .map(p => `<option value="${esc(p.projectId)}">${esc(p.name)}</option>`).join('');
  $('co-msg').innerHTML = '';
  openSheet('s-checkout');
}

async function submitPull() {
  const job = $('co-job').value.trim();
  if (!job) { $('co-msg').innerHTML = '<div class="err">Add a job name so this pull is traceable.</div>'; return; }
  const who = $('co-who').value.trim();
  if (!who) { $('co-msg').innerHTML = '<div class="err">Add your name.</div>'; return; }
  localStorage.setItem('who', who);

  const lines = Object.keys(pullSel).map(pn => ({ partNumber: pn, qty: pullSel[pn] }));
  const meta = { job, who, customer: $('co-cust').value.trim(),
                 project: $('co-proj').value, note: $('co-note').value.trim() };

  const r = await apiPost(Object.assign({ action: 'pull', lines }, meta));
  if (!r.ok) { $('co-msg').innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }

  buildPickList(meta, r.total);
  pullSel = {};
  closeSheet('s-checkout');
  ['co-job','co-cust','co-note'].forEach(id => $(id).value = '');
  await apiGet();
  setTimeout(() => window.print(), 350);
}

function buildPickList(meta, total) {
  const lines = Object.keys(pullSel).map(pn => {
    const p = DATA.parts.find(x => String(x.partNumber) === pn) || {};
    return { pn, name: partName(p), loc: p.binLocation || '',
             qty: pullSel[pn], price: Number(p.unitPrice) || 0 };
  });
  $('picklist').innerHTML = `
    <h1>Pick list</h1>
    <p><b>Job:</b> ${esc(meta.job)}<br>
       <b>Customer:</b> ${esc(meta.customer || '—')}<br>
       <b>Pulled by:</b> ${esc(meta.who)}<br>
       <b>Date:</b> ${new Date().toLocaleString()}</p>
    <table><thead><tr><th>Item</th><th>Part number</th><th>Location</th>
      <th>Qty</th><th>Ea</th><th>Total</th></tr></thead>
    <tbody>${lines.map(l => `<tr>
      <td>${esc(l.name)}</td><td class="m">${esc(l.pn)}</td><td>${esc(l.loc)}</td>
      <td class="m">${l.qty}</td><td class="m">${money(l.price)}</td>
      <td class="m">${money(l.qty * l.price)}</td></tr>`).join('')}
    </tbody></table>
    <p style="text-align:right;font-weight:600">Job material total: ${money(total)}</p>
    ${meta.note ? `<p><b>Notes:</b> ${esc(meta.note)}</p>` : ''}`;
}

/* ---------- projects ---------- */
function renderProjects() {
  const host = $('proj-list');
  if (!DATA.projects.length) {
    host.innerHTML = `<div class="empty"><strong>No projects yet</strong>
      Create one, then tag pulls to it to see what a job has cost so far.</div>`;
    return;
  }
  host.innerHTML = DATA.projects.map(p => {
    const spent = (DATA.transactions || [])
      .filter(t => String(t.project) === String(p.projectId))
      .reduce((s, t) => s + (Number(t.extended) || 0), 0);
    return `<div class="part" style="border-left-color:${
        p.status === 'Complete' ? 'var(--green)' : 'var(--accent)'}"
        onclick="editProject('${esc(p.projectId)}')">
      <div class="info">
        <div class="nm">${esc(p.name)}</div>
        <div class="pn">${esc(p.status)} · pulled to date ${money(spent)}</div>
      </div></div>`;
  }).join('');
}

function newProject() {
  editingProject = null;
  $('proj-title').textContent = 'New project';
  $('pj-name').value = ''; $('pj-status').value = 'Open'; $('pj-notes').value = '';
  $('pj-items').innerHTML = ''; $('pj-msg').innerHTML = '';
  $('pj-delete').style.display = 'none';
  openSheet('s-project');
}

function editProject(id) {
  const p = DATA.projects.find(x => String(x.projectId) === String(id));
  if (!p) return;
  editingProject = id;
  $('proj-title').textContent = p.name;
  $('pj-name').value = p.name;
  $('pj-status').value = p.status || 'Open';
  $('pj-notes').value = p.notes || '';
  $('pj-msg').innerHTML = '';
  $('pj-delete').style.display = '';

  const used = (DATA.transactions || []).filter(t => String(t.project) === String(id));
  $('pj-items').innerHTML = used.length ? `
    <div class="cat-head"><span>Parts pulled to this job</span></div>
    <div class="mini hd"><span>Item</span><span>Qty</span><span>Value</span></div>
    ${used.map(t => {
      const p2 = DATA.parts.find(x => String(x.partNumber) === String(t.partNumber));
      return `<div class="mini">
        <div><div class="rname">${esc(p2 ? partName(p2) : t.partNumber)}</div>
             <div class="rpn">${esc(t.partNumber)}</div></div>
        <div class="mono" style="text-align:center">${t.qty}</div>
        <div class="mono" style="text-align:right">${money(t.extended)}</div>
      </div>`;
    }).join('')}` : '<p class="note">Nothing pulled to this job yet.</p>';
  openSheet('s-project');
}

async function saveProject() {
  const name = $('pj-name').value.trim();
  if (!name) { $('pj-msg').innerHTML = '<div class="err">Give the project a name.</div>'; return; }
  const r = await apiPost({ action: 'saveProject', projectId: editingProject, name,
                            status: $('pj-status').value, notes: $('pj-notes').value.trim() });
  if (!r.ok) { $('pj-msg').innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  closeSheet('s-project');
  await apiGet();
}

async function deleteProject() {
  if (!editingProject) return;
  const p = DATA.projects.find(x => String(x.projectId) === String(editingProject));
  const name = p ? p.name : 'this project';
  const used = (DATA.transactions || [])
    .filter(t => String(t.project) === String(editingProject)).length;
  let msg = `Delete "${name}"?`;
  if (used) msg += `\n\n${used} pull${used > 1 ? 's have' : ' has'} been logged against it. ` +
    `Those parts really did leave the shelf, so the history stays — it just stops ` +
    `being tagged to this project. Stock counts do not change.`;
  if (!confirm(msg)) return;
  const r = await apiPost({ action: 'deleteProject', projectId: editingProject, force: true });
  if (!r.ok) { $('pj-msg').innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  closeSheet('s-project');
  editingProject = null;
  await apiGet();
}

/* ---------- boot ---------- */
$('inv-q').addEventListener('input', renderInventory);
$('pull-q').addEventListener('input', renderPull);
document.addEventListener('visibilitychange', () => { if (!document.hidden) apiGet(); });

if (API_URL.startsWith('PASTE_')) {
  setStatus('not set up', 'bad');
  $('inv-list').innerHTML = `<div class="empty"><strong>Almost there</strong>
    Open index.html and paste your Apps Script URL into API_URL near the bottom, then reload.</div>`;
} else {
  apiGet();
}
</script>
